[project]
name = "mcp-document-chat"
version = "0.1.0"
description = "Local MCP document assistant with FastMCP, Gemini integration, and CLI tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "mcp[cli]>=1.8.0",
    "prompt-toolkit>=3.0.51",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
